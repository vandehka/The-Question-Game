<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Between Us</title>

  <meta
    name="description"
    content="A conversation deck for two."
  >

  <style>
    :root {
      --bg-1: #172238;
      --bg-2: #263653;

      --accent: #b76d68;
      --accent-dark: #92514e;
      --accent-soft: #f4dedb;
      --accent-glow: rgba(183, 109, 104, 0.28);

      --card-1: #fffdf8;
      --card-2: #fff7ea;
      --card-border: #e7d4ba;

      --cream: #fffaf1;
      --cream-muted: rgba(255, 250, 241, 0.68);

      --ink: #2d3340;
      --ink-soft: #77737a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-1);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--cream);

      background:
        radial-gradient(
          circle at 50% 24%,
          var(--accent-glow),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          var(--bg-1),
          var(--bg-2)
        );

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;

      transition: background 350ms ease;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    .card:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.5);
      outline-offset: 3px;
    }

    .page {
      width: min(calc(100% - 24px), 720px);
      margin: 0 auto;

      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(32px, env(safe-area-inset-bottom));
    }

    /* Header */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 23px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brandSuit {
      display: grid;
      flex: 0 0 auto;
      place-items: center;

      width: 44px;
      height: 44px;

      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.07);

      font-family: Georgia, serif;
      font-size: 26px;
    }

    h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(28px, 5vw, 38px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 6px 0 0;

      color: var(--cream-muted);

      font-size: 13px;
    }

    .shareButton {
      display: grid;
      flex: 0 0 auto;
      place-items: center;

      width: 44px;
      height: 44px;
      padding: 0;

      color: var(--cream);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.07);

      font-size: 20px;
    }

    /* Vibe buttons */

    .vibeSection {
      margin-bottom: 21px;
    }

    .sectionLabel {
      display: block;

      margin: 0 0 8px 4px;

      color: rgba(255, 250, 241, 0.56);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .vibeButtons {
      display: flex;
      gap: 9px;

      overflow-x: auto;

      padding: 2px 2px 8px;

      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .vibeButtons::-webkit-scrollbar {
      display: none;
    }

    .vibeButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      flex: 0 0 auto;

      min-height: 46px;
      padding: 0 15px;

      color: rgba(255, 250, 241, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.055);

      font-size: 12px;
      font-weight: 750;

      transition:
        transform 160ms ease,
        color 200ms ease,
        background 200ms ease,
        border-color 200ms ease;
    }

    .vibeButton:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.09);
    }

    .vibeButton[aria-pressed="true"] {
      color: white;

      border-color:
        color-mix(
          in srgb,
          var(--accent) 65%,
          white 5%
        );

      background:
        color-mix(
          in srgb,
          var(--accent) 34%,
          transparent
        );

      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .vibeButtonSuit {
      font-family: Georgia, serif;
      font-size: 18px;
    }

    /* Deck */

    .deckArea {
      position: relative;

      margin: 0 6px 28px;
      padding-bottom: 13px;
    }

    .deckLayer {
      position: absolute;

      border: 1px solid var(--card-border);
      border-radius: 29px;

      background:
        linear-gradient(
          150deg,
          var(--card-1),
          var(--card-2)
        );

      box-shadow: 0 16px 32px rgba(5, 10, 22, 0.18);
    }

    .deckLayerOne {
      inset: 8px -6px -5px 8px;

      opacity: 0.7;

      transform: rotate(1.7deg);
    }

    .deckLayerTwo {
      inset: 5px 7px -2px -5px;

      opacity: 0.85;

      transform: rotate(-1deg);
    }

    .card {
      position: relative;
      z-index: 2;

      display: flex;
      min-height: 380px;
      overflow: hidden;
      flex-direction: column;

      padding: 25px 24px 22px;

      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: 29px;

      background:
        radial-gradient(
          circle at 88% 8%,
          var(--accent-soft),
          transparent 31%
        ),
        linear-gradient(
          150deg,
          var(--card-1),
          var(--card-2)
        );

      box-shadow:
        0 30px 70px rgba(5, 10, 22, 0.3),
        0 10px 24px rgba(5, 10, 22, 0.2);

      cursor: pointer;

      transition:
        transform 180ms ease,
        background 350ms ease;
    }

    .card:active {
      transform: scale(0.993);
    }

    .innerBorder {
      position: absolute;
      inset: 10px;

      border:
        1px solid
        color-mix(
          in srgb,
          var(--accent) 32%,
          transparent
        );

      border-radius: 22px;

      pointer-events: none;
    }

    .cornerSuit {
      position: absolute;
      z-index: 3;

      color: var(--accent);

      font-family: Georgia, serif;
      font-size: 24px;
    }

    .cornerTop {
      top: 18px;
      left: 20px;
    }

    .cornerBottom {
      right: 20px;
      bottom: 18px;

      transform: rotate(180deg);
    }

    .cardMeta {
      position: relative;
      z-index: 4;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 0 15px;
    }

    .vibePill {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      min-height: 30px;
      padding: 0 12px;

      color: var(--accent-dark);

      border:
        1px solid
        color-mix(
          in srgb,
          var(--accent) 30%,
          transparent
        );

      border-radius: 999px;

      background: var(--accent-soft);

      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .remainingCount {
      color: var(--ink-soft);

      font-size: 11px;
      font-weight: 650;
      text-align: right;
    }

    .questionWrap {
      position: relative;
      z-index: 3;

      display: grid;
      flex: 1;
      place-items: center;

      padding: 32px 14px 24px;
    }

    .question {
      width: min(100%, 560px);
      margin: 0;

      color: var(--ink);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(28px, 6vw, 40px);
      font-weight: 500;
      line-height: 1.28;
      letter-spacing: -0.024em;
      text-align: center;
    }

    .question.isWelcome {
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .welcomeSuit {
      display: grid;
      place-items: center;

      width: 64px;
      height: 64px;
      margin-bottom: 18px;

      color: var(--accent);

      border:
        1px solid
        color-mix(
          in srgb,
          var(--accent) 30%,
          transparent
        );

      border-radius: 50%;

      background: var(--accent-soft);

      font-family: Georgia, serif;
      font-size: 32px;
    }

    .welcomeTitle {
      font-size: clamp(35px, 8vw, 48px);
    }

    .welcomeText {
      margin-top: 10px;

      color: var(--ink-soft);

      font-family:
        Inter,
        system-ui,
        sans-serif;

      font-size: 13px;
    }

    .tapHint {
      position: relative;
      z-index: 3;

      margin: 0;
      padding: 0 16px;

      color: var(--ink-soft);

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-align: center;
      text-transform: uppercase;
    }

    /* Main actions */

    .actions {
      display: flex;
      align-items: center;
      flex-direction: column;

      margin-bottom: 42px;
    }

    .dealButton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: min(100%, 390px);
      min-height: 58px;
      padding: 0 22px;

      color: white;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          var(--accent-dark),
          var(--accent)
        );

      box-shadow:
        0 16px 31px var(--accent-glow),
        inset 0 1px rgba(255, 255, 255, 0.22);

      font-weight: 800;
    }

    .dealSuit {
      font-family: Georgia, serif;
      font-size: 21px;
    }

    .smallActions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;

      margin-top: 12px;
    }

    .smallButton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      min-height: 43px;
      padding: 0 15px;

      color: rgba(255, 250, 241, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.06);

      font-size: 12px;
      font-weight: 700;
    }

    .smallButton.isSaved {
      color: white;

      border-color:
        color-mix(
          in srgb,
          var(--accent) 55%,
          transparent
        );

      background:
        color-mix(
          in srgb,
          var(--accent) 32%,
          transparent
        );
    }

    /* Saved cards */

    .savedSection {
      padding: 23px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.035)
        );

      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.07),
        0 18px 44px rgba(5, 10, 22, 0.14);
    }

    .savedHeader {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 15px;

      margin-bottom: 18px;
    }

    .eyebrow {
      display: block;

      margin-bottom: 6px;

      color: rgba(255, 250, 241, 0.48);

      font-size: 9px;
      font-weight: 850;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .savedTitle {
      display: flex;
      align-items: center;
      gap: 9px;

      margin: 0;

      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: 500;
    }

    .savedCount {
      display: grid;
      place-items: center;

      min-width: 26px;
      height: 26px;
      padding: 0 8px;

      color: var(--bg-1);
      border-radius: 999px;

      background: var(--cream);

      font-family: Inter, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 850;
    }

    .savedHeaderActions {
      display: flex;
      gap: 13px;
    }

    .textButton {
      padding: 3px 0;

      color: rgba(255, 250, 241, 0.62);
      border: 0;

      background: transparent;

      font-size: 11px;
      font-weight: 750;
    }

    .savedList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .savedCard {
      min-height: 155px;
      padding: 16px;

      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          var(--card-1),
          var(--card-2)
        );

      box-shadow: 0 12px 25px rgba(5, 10, 22, 0.14);
    }

    .savedCardTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 14px;
    }

    .savedPill {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      min-height: 24px;
      padding: 0 8px;

      border-radius: 999px;

      font-size: 8px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .removeButton {
      display: grid;
      place-items: center;

      width: 28px;
      height: 28px;
      padding: 0;

      color: var(--ink-soft);
      border: 0;
      border-radius: 50%;

      background: rgba(46, 51, 64, 0.06);

      font-size: 17px;
    }

    .savedQuestion {
      margin: 0;

      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1.42;
    }

    .savedEmpty {
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;

      min-height: 130px;

      color: rgba(255, 250, 241, 0.48);

      text-align: center;
    }

    .savedEmptySuit {
      color: var(--accent);

      font-family: Georgia, serif;
      font-size: 29px;
    }

    .savedEmpty p {
      margin: 8px 0 0;

      font-size: 12px;
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 7px;

      padding: 24px 6px 0;

      color: rgba(255, 250, 241, 0.38);

      font-size: 10px;
      text-align: center;
    }

    /* Toast */

    .toast {
      position: fixed;
      z-index: 100;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;

      max-width: calc(100vw - 30px);
      padding: 12px 17px;

      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: 999px;

      background: var(--card-1);

      box-shadow: 0 18px 42px rgba(5, 10, 22, 0.3);

      opacity: 0;
      pointer-events: none;

      font-size: 12px;
      font-weight: 750;

      transform: translate(-50%, 13px);

      transition:
        opacity 200ms ease,
        transform 200ms ease;
    }

    .toast.show {
      opacity: 1;

      transform: translate(-50%, 0);
    }

    /* Deal animation */

    .card.isDealing {
      animation:
        dealCard
        400ms
        cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    @keyframes dealCard {
      from {
        opacity: 0.5;

        transform:
          translate(23px, -8px)
          rotate(1.3deg)
          scale(0.985);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Mobile */

    @media (max-width: 620px) {
      .page {
        width: min(calc(100% - 20px), 720px);
        padding-top: 20px;
      }

      .brandSuit {
        width: 40px;
        height: 40px;

        font-size: 23px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        max-width: 245px;

        font-size: 11px;
      }

      .shareButton {
        width: 41px;
        height: 41px;
      }

      .card {
        min-height: 360px;
        padding: 22px 18px 20px;

        border-radius: 27px;
      }

      .deckLayer {
        border-radius: 27px;
      }

      .cardMeta {
        padding: 0 10px;
      }

      .remainingCount {
        max-width: 130px;

        font-size: 10px;
      }

      .question {
        font-size: clamp(27px, 8vw, 35px);
      }

      .dealButton {
        width: 100%;
      }

      .smallActions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

        width: 100%;
      }

      .smallButton {
        padding: 0 9px;
      }

      .savedSection {
        padding: 21px 17px;
      }

      .savedHeader {
        align-items: flex-start;
        flex-direction: column;
      }

      .savedHeaderActions {
        align-self: flex-end;
      }

      .savedList {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 390px) {
      .brandSuit {
        display: none;
      }

      h1 {
        font-size: 25px;
      }

      .question {
        font-size: 26px;
      }

      .smallButton {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="brand">
        <div id="brandSuit" class="brandSuit" aria-hidden="true">
          ✦
        </div>

        <div>
          <h1>Between Us</h1>
          <p class="subtitle">A conversation deck for two.</p>
        </div>
      </div>

      <button
        id="shareButton"
        class="shareButton"
        type="button"
        aria-label="Copy a shareable link"
      >
        ↗
      </button>
    </header>

    <section
      class="vibeSection"
      aria-labelledby="vibeLabel"
    >
      <span id="vibeLabel" class="sectionLabel">
        Choose your vibe
      </span>

      <div
        id="vibeButtons"
        class="vibeButtons"
        role="group"
        aria-label="Choose your vibe"
      ></div>
    </section>

    <section class="deckArea">
      <div
        class="deckLayer deckLayerOne"
        aria-hidden="true"
      ></div>

      <div
        class="deckLayer deckLayerTwo"
        aria-hidden="true"
      ></div>

      <article
        id="card"
        class="card"
        tabindex="0"
        role="button"
        aria-label="Deal the next conversation card"
      >
        <div
          class="innerBorder"
          aria-hidden="true"
        ></div>

        <span
          id="cornerTop"
          class="cornerSuit cornerTop"
          aria-hidden="true"
        >
          ✦
        </span>

        <span
          id="cornerBottom"
          class="cornerSuit cornerBottom"
          aria-hidden="true"
        >
          ✦
        </span>

        <div class="cardMeta">
          <span class="vibePill">
            <span id="pillSuit" aria-hidden="true">✦</span>
            <span id="pillText">All</span>
          </span>

          <span
            id="remainingCount"
            class="remainingCount"
          ></span>
        </div>

        <div class="questionWrap">
          <p
            id="question"
            class="question isWelcome"
          >
            <span
              id="welcomeSuit"
              class="welcomeSuit"
              aria-hidden="true"
            >
              ✦
            </span>

            <span class="welcomeTitle">Ready?</span>

            <span class="welcomeText">
              Tap the card to begin.
            </span>
          </p>
        </div>

        <p class="tapHint">
          Tap the card for the next question
        </p>
      </article>
    </section>

    <section class="actions">
      <button
        id="dealButton"
        class="dealButton"
        type="button"
      >
        <span
          id="dealSuit"
          class="dealSuit"
          aria-hidden="true"
        >
          ✦
        </span>

        Deal Next Card
      </button>

      <div class="smallActions">
        <button
          id="saveButton"
          class="smallButton"
          type="button"
        >
          <span id="saveIcon" aria-hidden="true">♡</span>
          <span id="saveText">Save</span>
        </button>

        <button
          id="copyButton"
          class="smallButton"
          type="button"
        >
          ⧉ Copy
        </button>

        <button
          id="resetButton"
          class="smallButton"
          type="button"
        >
          ↻ Reset
        </button>
      </div>
    </section>

    <section class="savedSection">
      <div class="savedHeader">
        <div>
          <span class="eyebrow">Your collection</span>

          <h2 class="savedTitle">
            Saved Cards

            <span
              id="savedCount"
              class="savedCount"
            >
              0
            </span>
          </h2>
        </div>

        <div class="savedHeaderActions">
          <button
            id="copyAllButton"
            class="textButton"
            type="button"
          >
            Copy all
          </button>

          <button
            id="clearButton"
            class="textButton"
            type="button"
          >
            Clear
          </button>
        </div>
      </div>

      <ul
        id="savedList"
        class="savedList"
      ></ul>

      <div
        id="savedEmpty"
        class="savedEmpty"
      >
        <span
          class="savedEmptySuit"
          aria-hidden="true"
        >
          ♡
        </span>

        <p>
          Save a question you would love to revisit.
        </p>
      </div>
    </section>

    <footer>
      Made for slow conversations and good company.
      <span aria-hidden="true">♡</span>
    </footer>
  </main>

  <script src="questions.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);

    const QUESTIONS = (window.QUESTIONS || [])
      .map((item) => ({
        id: item.id,
        category: String(item.category || "").trim(),
        question: String(item.question || "").trim()
      }))
      .filter((item) => item.category && item.question);

    const categories = [
      ...new Set(
        QUESTIONS.map((item) => item.category)
      )
    ].sort();

    const storage = {
      get(key, fallback) {
        try {
          return (
            JSON.parse(localStorage.getItem(key)) ??
            fallback
          );
        } catch {
          return fallback;
        }
      },

      set(key, value) {
        localStorage.setItem(
          key,
          JSON.stringify(value)
        );
      },

      remove(key) {
        localStorage.removeItem(key);
      }
    };

    const state = {
      category: "All",
      currentId: null,

      usedByCategory: storage.get(
        "between_us_used_v1",
        {}
      ),

      favorites: storage.get(
        "cs_favorites_v1",
        []
      )
    };

    const themes = [
      {
        keywords: [
          "flirty",
          "flirt",
          "romance",
          "romantic"
        ],
        suit: "♥",
        accent: "#c76372",
        dark: "#9d4554",
        soft: "#f8dce1",
        background1: "#2a1824",
        background2: "#4b2336",
        glow: "rgba(199, 99, 114, 0.32)"
      },

      {
        keywords: [
          "deep",
          "meaningful",
          "vulnerable"
        ],
        suit: "♦",
        accent: "#647fb0",
        dark: "#465f91",
        soft: "#e0e8f7",
        background1: "#172238",
        background2: "#293b60",
        glow: "rgba(100, 127, 176, 0.30)"
      },

      {
        keywords: [
          "fun",
          "funny",
          "light",
          "lighthearted",
          "silly"
        ],
        suit: "♣",
        accent: "#d59b4c",
        dark: "#ad7430",
        soft: "#f8e9ce",
        background1: "#252238",
        background2: "#514326",
        glow: "rgba(213, 155, 76, 0.30)"
      },

      {
        keywords: [
          "spicy",
          "bold",
          "hot"
        ],
        suit: "♠",
        accent: "#a84e57",
        dark: "#7e333c",
        soft: "#f1d9dc",
        background1: "#24171d",
        background2: "#51252c",
        glow: "rgba(168, 78, 87, 0.32)"
      },

      {
        keywords: [
          "relationship",
          "couples",
          "partner",
          "love"
        ],
        suit: "♡",
        accent: "#b9859c",
        dark: "#8d6175",
        soft: "#f2e0e8",
        background1: "#211c31",
        background2: "#493147",
        glow: "rgba(185, 133, 156, 0.30)"
      },

      {
        keywords: [
          "future",
          "dreams",
          "goals"
        ],
        suit: "✦",
        accent: "#7f8fc4",
        dark: "#5e6da1",
        soft: "#e3e7f6",
        background1: "#18233c",
        background2: "#35416b",
        glow: "rgba(127, 143, 196, 0.30)"
      }
    ];

    const defaultTheme = {
      suit: "✦",
      accent: "#b76d68",
      dark: "#92514e",
      soft: "#f4dedb",
      background1: "#172238",
      background2: "#263653",
      glow: "rgba(183, 109, 104, 0.28)"
    };

    function hashText(text) {
      return [...text].reduce(
        (total, character) =>
          (
            (total << 5) -
            total +
            character.charCodeAt(0)
          ) | 0,
        0
      );
    }

    function getTheme(category) {
      if (category === "All") {
        return defaultTheme;
      }

      const normalizedCategory =
        category.toLowerCase();

      const matchingTheme = themes.find(
        (theme) =>
          theme.keywords.some(
            (keyword) =>
              normalizedCategory.includes(keyword)
          )
      );

      if (matchingTheme) {
        return matchingTheme;
      }

      const extraSuits = [
        "♦",
        "♣",
        "♠",
        "✦",
        "●"
      ];

      return {
        ...defaultTheme,

        suit:
          extraSuits[
            Math.abs(
              hashText(normalizedCategory)
            ) % extraSuits.length
          ]
      };
    }

    function applyTheme() {
      const theme = getTheme(state.category);
      const root = document.documentElement;

      root.style.setProperty(
        "--accent",
        theme.accent
      );

      root.style.setProperty(
        "--accent-dark",
        theme.dark
      );

      root.style.setProperty(
        "--accent-soft",
        theme.soft
      );

      root.style.setProperty(
        "--bg-1",
        theme.background1
      );

      root.style.setProperty(
        "--bg-2",
        theme.background2
      );

      root.style.setProperty(
        "--accent-glow",
        theme.glow
      );

      const suitElements = [
        "brandSuit",
        "cornerTop",
        "cornerBottom",
        "pillSuit",
        "welcomeSuit",
        "dealSuit"
      ];

      suitElements.forEach((id) => {
        const element = $(id);

        if (element) {
          element.textContent = theme.suit;
        }
      });

      $("pillText").textContent =
        state.category;
    }

    function filteredQuestions() {
      if (state.category === "All") {
        return QUESTIONS;
      }

      return QUESTIONS.filter(
        (item) =>
          item.category === state.category
      );
    }

    function usedQuestionIds() {
      return new Set(
        state.usedByCategory[state.category] || []
      );
    }

    function updateRemainingCount() {
      const questions = filteredQuestions();
      const used = usedQuestionIds();

      const remaining = questions.filter(
        (item) => !used.has(item.id)
      ).length;

      $("remainingCount").textContent =
        `${remaining} of ${questions.length} remaining`;
    }

    function getNextQuestion() {
      const questions = filteredQuestions();

      if (!questions.length) {
        toast("No questions found in this vibe");
        return null;
      }

      const used = usedQuestionIds();

      let available = questions.filter(
        (item) => !used.has(item.id)
      );

      if (!available.length) {
        state.usedByCategory[state.category] = [];

        storage.set(
          "between_us_used_v1",
          state.usedByCategory
        );

        available = questions;

        toast("Deck complete — reshuffling");
      }

      return available[
        Math.floor(
          Math.random() * available.length
        )
      ];
    }

    function dealNextCard() {
      const nextQuestion = getNextQuestion();

      if (!nextQuestion) {
        return;
      }

      state.currentId = nextQuestion.id;

      if (
        !state.usedByCategory[state.category]
      ) {
        state.usedByCategory[state.category] = [];
      }

      state.usedByCategory[state.category]
        .push(nextQuestion.id);

      storage.set(
        "between_us_used_v1",
        state.usedByCategory
      );

      $("question").className = "question";
      $("question").textContent =
        nextQuestion.question;

      updateRemainingCount();
      renderSaveButton();
      animateCard();
      updateUrl();
    }

    function animateCard() {
      const card = $("card");

      card.classList.remove("isDealing");

      void card.offsetWidth;

      card.classList.add("isDealing");
    }

    function showWelcomeCard() {
      const theme = getTheme(state.category);

      state.currentId = null;

      $("question").className =
        "question isWelcome";

      $("question").innerHTML = `
        <span
          id="welcomeSuit"
          class="welcomeSuit"
          aria-hidden="true"
        >
          ${theme.suit}
        </span>

        <span class="welcomeTitle">
          Ready?
        </span>

        <span class="welcomeText">
          Tap the card to begin.
        </span>
      `;

      renderSaveButton();
    }

    function isFavorited(id) {
      return state.favorites.includes(id);
    }

    function saveFavorites() {
      if (state.favorites.length) {
        storage.set(
          "cs_favorites_v1",
          state.favorites
        );
      } else {
        storage.remove("cs_favorites_v1");
      }
    }

    function renderSaveButton() {
      const isSaved =
        state.currentId !== null &&
        isFavorited(state.currentId);

      $("saveButton").classList.toggle(
        "isSaved",
        isSaved
      );

      $("saveIcon").textContent =
        isSaved ? "♥" : "♡";

      $("saveText").textContent =
        isSaved ? "Saved" : "Save";
    }

    function toggleFavorite() {
      if (state.currentId === null) {
        toast("Deal a card first");
        return;
      }

      if (isFavorited(state.currentId)) {
        state.favorites =
          state.favorites.filter(
            (id) => id !== state.currentId
          );
      } else {
        state.favorites.unshift(
          state.currentId
        );
      }

      saveFavorites();
      renderSaveButton();
      renderSavedCards();

      toast(
        isFavorited(state.currentId)
          ? "Saved for later"
          : "Removed"
      );
    }

    function escapeHtml(text) {
      return String(text).replace(
        /[&<>"']/g,
        (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[character]
      );
    }

    function renderSavedCards() {
      $("savedCount").textContent =
        state.favorites.length;

      $("savedList").innerHTML = "";

      const savedQuestions = state.favorites
        .map(
          (id) =>
            QUESTIONS.find(
              (item) => item.id === id
            )
        )
        .filter(Boolean);

      $("savedEmpty").style.display =
        savedQuestions.length
          ? "none"
          : "flex";

      savedQuestions.forEach((item) => {
        const theme = getTheme(item.category);

        const listItem =
          document.createElement("li");

        listItem.className = "savedCard";

        listItem.innerHTML = `
          <div class="savedCardTop">
            <span
              class="savedPill"
              style="
                color: ${theme.dark};
                background: ${theme.soft};
                border: 1px solid ${theme.accent}55;
              "
            >
              ${theme.suit}
              ${escapeHtml(item.category)}
            </span>

            <button
              class="removeButton"
              type="button"
              aria-label="Remove saved card"
            >
              ×
            </button>
          </div>

          <p class="savedQuestion">
            ${escapeHtml(item.question)}
          </p>
        `;

        listItem
          .querySelector(".removeButton")
          .addEventListener(
            "click",
            () => {
              state.favorites =
                state.favorites.filter(
                  (id) => id !== item.id
                );

              saveFavorites();
              renderSavedCards();
              renderSaveButton();

              toast("Removed");
            }
          );

        $("savedList").appendChild(
          listItem
        );
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(
          text
        );
      } catch {
        const textArea =
          document.createElement("textarea");

        textArea.value = text;

        document.body.appendChild(textArea);

        textArea.select();

        document.execCommand("copy");

        textArea.remove();
      }

      toast("Copied");
    }

    function toast(message) {
      const currentToast =
        document.querySelector(".toast");

      if (currentToast) {
        currentToast.remove();
      }

      const toastElement =
        document.createElement("div");

      toastElement.className = "toast";
      toastElement.textContent = message;

      document.body.appendChild(
        toastElement
      );

      setTimeout(
        () =>
          toastElement.classList.add(
            "show"
          ),
        10
      );

      setTimeout(() => {
        toastElement.classList.remove(
          "show"
        );

        setTimeout(
          () => toastElement.remove(),
          250
        );
      }, 1400);
    }

    function updateUrl() {
      const url = new URL(
        window.location.href
      );

      url.searchParams.set(
        "cat",
        state.category
      );

      if (state.currentId === null) {
        url.searchParams.delete("q");
      } else {
        url.searchParams.set(
          "q",
          String(state.currentId)
        );
      }

      window.history.replaceState(
        {},
        "",
        url
      );
    }

    function renderVibeButtons() {
      const container = $("vibeButtons");

      container.innerHTML = "";

      ["All", ...categories].forEach(
        (category) => {
          const theme = getTheme(category);

          const button =
            document.createElement("button");

          button.type = "button";
          button.className = "vibeButton";

          button.setAttribute(
            "aria-pressed",
            String(
              category === state.category
            )
          );

          button.innerHTML = `
            <span
              class="vibeButtonSuit"
              aria-hidden="true"
            >
              ${theme.suit}
            </span>

            <span>
              ${escapeHtml(category)}
            </span>
          `;

          button.addEventListener(
            "click",
            () => {
              state.category = category;

              applyTheme();
              showWelcomeCard();
              updateRemainingCount();
              updateUrl();
              renderVibeButtons();
            }
          );

          container.appendChild(button);
        }
      );

      const activeButton =
        container.querySelector(
          '[aria-pressed="true"]'
        );

      if (activeButton) {
        activeButton.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "center"
        });
      }
    }

    function hydrateFromUrl() {
      const url = new URL(
        window.location.href
      );

      const category =
        url.searchParams.get("cat");

      const questionId = Number(
        url.searchParams.get("q")
      );

      if (
        category &&
        (
          category === "All" ||
          categories.includes(category)
        )
      ) {
        state.category = category;
      }

      applyTheme();
      renderVibeButtons();

      const sharedQuestion =
        QUESTIONS.find(
          (item) => item.id === questionId
        );

      if (sharedQuestion) {
        state.currentId =
          sharedQuestion.id;

        $("question").className =
          "question";

        $("question").textContent =
          sharedQuestion.question;
      } else {
        showWelcomeCard();
      }

      updateRemainingCount();
      renderSaveButton();
      renderSavedCards();
    }

    $("dealButton").addEventListener(
      "click",
      dealNextCard
    );

    $("card").addEventListener(
      "click",
      dealNextCard
    );

    $("card").addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          event.preventDefault();
          dealNextCard();
        }
      }
    );

    $("saveButton").addEventListener(
      "click",
      toggleFavorite
    );

    $("copyButton").addEventListener(
      "click",
      () => {
        if (state.currentId === null) {
          toast("Deal a card first");
          return;
        }

        copyText(
          $("question").textContent
        );
      }
    );

    $("resetButton").addEventListener(
      "click",
      () => {
        state.usedByCategory[
          state.category
        ] = [];

        storage.set(
          "between_us_used_v1",
          state.usedByCategory
        );

        updateRemainingCount();

        toast("Deck reset");
      }
    );

    $("shareButton").addEventListener(
      "click",
      () => {
        copyText(window.location.href);
      }
    );

    $("clearButton").addEventListener(
      "click",
      () => {
        state.favorites = [];

        saveFavorites();
        renderSavedCards();
        renderSaveButton();

        toast("Saved cards cleared");
      }
    );

    $("copyAllButton").addEventListener(
      "click",
      () => {
        const savedQuestions =
          state.favorites
            .map(
              (id) =>
                QUESTIONS.find(
                  (item) =>
                    item.id === id
                )
            )
            .filter(Boolean);

        if (!savedQuestions.length) {
          toast("Nothing saved yet");
          return;
        }

        const text = savedQuestions
          .map(
            (item) =>
              `[${item.category}] ${item.question}`
          )
          .join("\n\n");

        copyText(text);
      }
    );

    hydrateFromUrl();
  </script>
</body>
