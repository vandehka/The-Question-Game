<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>The Conversation Game</title>

  <meta
    name="description"
    content="Choose a vibe and discover meaningful conversations, one card at a time."
  />

  <style>
    /* ==================================================
       THE CONVERSATION GAME
       Everything is contained in this file.
    ================================================== */

    :root {
      --bg-dark: #172238;
      --bg-mid: #22334e;
      --bg-glow: rgba(181, 110, 104, 0.3);

      --accent: #b76d68;
      --accent-dark: #92514e;
      --accent-soft: #f4dedb;
      --accent-glow: rgba(183, 109, 104, 0.28);

      --card-top: #fffdf8;
      --card-bottom: #fff7ea;
      --card-border: #e8d4b9;

      --cream: #fffaf1;
      --cream-muted: rgba(255, 250, 241, 0.68);
      --cream-faint: rgba(255, 250, 241, 0.12);

      --ink: #2e3340;
      --ink-soft: #737176;

      --gold: #ad8450;
      --danger: #d78e88;

      --shadow-card:
        0 30px 70px rgba(5, 10, 22, 0.3),
        0 10px 24px rgba(5, 10, 22, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-dark);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;

      color: var(--cream);

      background:
        radial-gradient(
          circle at 50% 28%,
          var(--bg-glow),
          transparent 34%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(255, 255, 255, 0.06),
          transparent 32%
        ),
        linear-gradient(
          150deg,
          var(--bg-dark),
          var(--bg-mid)
        );

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;

      transition:
        background 400ms ease,
        color 250ms ease;
    }

    button,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    select,
    .questionCard {
      touch-action: manipulation;
    }

    /* ==================================================
       PAGE
    ================================================== */

    .page {
      position: relative;

      width: min(100% - 28px, 720px);
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(30px, env(safe-area-inset-bottom));
    }

    /* ==================================================
       HEADER
    ================================================== */

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;

      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brandSuit {
      display: grid;
      flex: 0 0 auto;
      place-items: center;

      width: 46px;
      height: 46px;

      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.08);

      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.09),
        0 12px 25px rgba(6, 12, 25, 0.18);

      font-family: Georgia, serif;
      font-size: 26px;

      transition:
        color 300ms ease,
        transform 300ms ease;
    }

    .brandText h1 {
      margin: 0;

      color: var(--cream);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(27px, 5.6vw, 38px);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 7px 0 0;

      color: var(--cream-muted);

      font-size: 13px;
      line-height: 1.45;
    }

    .shareButton {
      display: grid;
      flex: 0 0 auto;
      place-items: center;

      width: 45px;
      height: 45px;
      padding: 0;

      color: var(--cream);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.07);

      cursor: pointer;

      font-size: 20px;

      transition:
        transform 160ms ease,
        background 160ms ease;
    }

    .shareButton:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .shareButton:active {
      transform: scale(0.96);
    }

    /* ==================================================
       VIBE CONTROL
    ================================================== */

    .vibeControl {
      position: relative;

      margin-bottom: 25px;
    }

    .controlLabel {
      display: block;

      margin: 0 0 8px 4px;

      color: rgba(255, 250, 241, 0.58);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .selectShell {
      position: relative;
    }

    .selectSuit {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 17px;

      color: var(--accent);

      font-family: Georgia, serif;
      font-size: 20px;

      pointer-events: none;

      transform: translateY(-52%);

      transition: color 250ms ease;
    }

    .selectShell::after {
      position: absolute;
      top: 50%;
      right: 18px;

      content: "⌄";

      color: rgba(255, 250, 241, 0.55);

      pointer-events: none;

      transform: translateY(-60%);
    }

    .vibeSelect {
      width: 100%;
      min-height: 54px;
      padding: 0 45px 0 49px;

      appearance: none;

      color: var(--cream);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.055)
        );

      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.08);

      cursor: pointer;

      font-weight: 650;
    }

    .vibeSelect option {
      color: #232936;
      background: white;
    }

    /* ==================================================
       QUESTION DECK
    ================================================== */

    .deckArea {
      position: relative;

      margin: 0 7px 28px;
      padding-bottom: 14px;
    }

    .deckLayer {
      position: absolute;

      border: 1px solid var(--card-border);
      border-radius: 30px;

      background:
        linear-gradient(
          150deg,
          var(--card-top),
          var(--card-bottom)
        );

      box-shadow: 0 16px 32px rgba(5, 10, 22, 0.18);

      transition:
        background 300ms ease,
        border-color 300ms ease;
    }

    .deckLayerOne {
      inset: 8px -7px -5px 8px;
      opacity: 0.72;

      transform: rotate(1.8deg);
    }

    .deckLayerTwo {
      inset: 5px 7px -2px -5px;
      opacity: 0.86;

      transform: rotate(-1deg);
    }

    .questionCard {
      position: relative;
      z-index: 3;

      display: flex;
      min-height: 390px;
      overflow: hidden;
      flex-direction: column;

      padding: 25px 25px 22px;

      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: 30px;

      background:
        radial-gradient(
          circle at 88% 8%,
          var(--accent-soft),
          transparent 30%
        ),
        linear-gradient(
          150deg,
          var(--card-top),
          var(--card-bottom)
        );

      box-shadow: var(--shadow-card);

      cursor: pointer;

      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 350ms ease,
        border-color 350ms ease;
    }

    .questionCard:hover {
      transform: translateY(-2px);

      box-shadow:
        0 34px 76px rgba(5, 10, 22, 0.34),
        0 12px 28px rgba(5, 10, 22, 0.2);
    }

    .questionCard:active {
      transform: translateY(1px) scale(0.993);
    }

    .innerBorder {
      position: absolute;
      inset: 10px;

      border: 1px solid color-mix(
        in srgb,
        var(--accent) 32%,
        transparent
      );

      border-radius: 22px;

      pointer-events: none;
    }

    .corner {
      position: absolute;
      z-index: 2;

      color: var(--accent);

      font-family: Georgia, serif;
      font-size: 24px;

      transition: color 250ms ease;
    }

    .cornerTop {
      top: 19px;
      left: 20px;
    }

    .cornerBottom {
      right: 20px;
      bottom: 19px;

      transform: rotate(180deg);
    }

    .cardMeta {
      position: relative;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 0 16px;
    }

    .vibePill {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      min-height: 30px;
      padding: 0 12px;

      color: var(--accent-dark);
      border: 1px solid color-mix(
        in srgb,
        var(--accent) 30%,
        transparent
      );

      border-radius: 999px;

      background: var(--accent-soft);

      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;

      transition:
        color 250ms ease,
        background 250ms ease,
        border-color 250ms ease;
    }

    .pillSuit {
      font-family: Georgia, serif;
      font-size: 14px;
    }

    .remainingCount {
      color: var(--ink-soft);

      font-size: 11px;
      font-weight: 650;
      text-align: right;
    }

    .questionContainer {
      position: relative;
      z-index: 2;

      display: grid;
      flex: 1;
      place-items: center;

      padding: 33px 15px 25px;
    }

    .question {
      width: min(100%, 560px);
      margin: 0;

      color: var(--ink);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(27px, 6vw, 40px);
      font-weight: 500;
      line-height: 1.28;
      letter-spacing: -0.024em;
      text-align: center;
    }

    .question.welcome {
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .welcomeSuit {
      display: grid;
      place-items: center;

      width: 64px;
      height: 64px;
      margin-bottom: 19px;

      color: var(--accent);
      border: 1px solid color-mix(
        in srgb,
        var(--accent) 30%,
        transparent
      );

      border-radius: 50%;

      background: var(--accent-soft);

      font-family: Georgia, serif;
      font-size: 32px;

      transition:
        color 250ms ease,
        background 250ms ease;
    }

    .welcomeTitle {
      font-size: clamp(34px, 8vw, 47px);
    }

    .welcomeMessage {
      margin-top: 10px;

      color: var(--ink-soft);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 13px;
      font-weight: 550;
      letter-spacing: 0;
    }

    .tapHint {
      position: relative;
      z-index: 3;

      margin: 0;
      padding: 0 18px;

      color: var(--ink-soft);

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-align: center;
      text-transform: uppercase;
    }

    /* ==================================================
       BUTTONS
    ================================================== */

    .actions {
      display: flex;
      align-items: center;
      flex-direction: column;

      margin-bottom: 43px;
    }

    .dealButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: min(100%, 390px);
      min-height: 58px;
      padding: 0 22px;

      color: white;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          var(--accent-dark),
          var(--accent)
        );

      box-shadow:
        0 16px 31px var(--accent-glow),
        inset 0 1px rgba(255, 255, 255, 0.22);

      cursor: pointer;

      font-weight: 800;
      letter-spacing: 0.01em;

      transition:
        transform 160ms ease,
        background 250ms ease,
        box-shadow 250ms ease;
    }

    .dealButton:hover {
      transform: translateY(-1px);
    }

    .dealButton:active {
      transform: translateY(1px) scale(0.985);
    }

    .dealSuit {
      font-family: Georgia, serif;
      font-size: 21px;
    }

    .smallActions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;

      margin-top: 12px;
    }

    .smallButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      min-height: 43px;
      padding: 0 15px;

      color: rgba(255, 250, 241, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.06);

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      transition:
        transform 150ms ease,
        background 150ms ease,
        border-color 150ms ease;
    }

    .smallButton:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .smallButton:active {
      transform: scale(0.98);
    }

    .smallButton.saved {
      color: white;
      border-color: color-mix(
        in srgb,
        var(--accent) 55%,
        transparent
      );

      background: color-mix(
        in srgb,
        var(--accent) 32%,
        transparent
      );
    }

    /* ==================================================
       SAVED CARDS
    ================================================== */

    .savedSection {
      padding: 23px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.035)
        );

      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.07),
        0 18px 44px rgba(5, 10, 22, 0.14);

      backdrop-filter: blur(12px);
    }

    .savedHeader {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 18px;
    }

    .eyebrow {
      display: block;

      margin-bottom: 6px;

      color: rgba(255, 250, 241, 0.48);

      font-size: 9px;
      font-weight: 850;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .savedTitle {
      display: flex;
      align-items: center;
      gap: 9px;

      margin: 0;

      color: var(--cream);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;
      font-weight: 500;
    }

    .savedCount {
      display: inline-grid;
      place-items: center;

      min-width: 26px;
      height: 26px;
      padding: 0 8px;

      color: var(--bg-dark);
      border-radius: 999px;

      background: var(--cream);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 10px;
      font-weight: 850;
    }

    .savedHeaderActions {
      display: flex;
      gap: 13px;
    }

    .textButton {
      padding: 3px 0;

      color: rgba(255, 250, 241, 0.62);
      border: 0;

      background: transparent;

      cursor: pointer;

      font-size: 11px;
      font-weight: 750;
    }

    .textButton:hover {
      color: white;
    }

    .clearButton:hover {
      color: var(--danger);
    }

    .savedList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .savedCard {
      min-height: 160px;
      padding: 16px;

      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          var(--card-top),
          var(--card-bottom)
        );

      box-shadow: 0 12px 25px rgba(5, 10, 22, 0.14);
    }

    .savedCardTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 15px;
    }

    .savedCardVibe {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      min-height: 24px;
      padding: 0 8px;

      border-radius: 999px;

      font-size: 8px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .removeButton {
      display: grid;
      place-items: center;

      width: 28px;
      height: 28px;
      padding: 0;

      color: var(--ink-soft);
      border: 0;
      border-radius: 50%;

      background: rgba(46, 51, 64, 0.06);

      cursor: pointer;

      font-size: 17px;
    }

    .savedQuestion {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 17px;
      line-height: 1.42;
    }

    .savedEmpty {
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;

      min-height: 135px;
      padding: 20px;

      color: rgba(255, 250, 241, 0.48);

      text-align: center;
    }

    .savedEmptySuit {
      color: var(--accent);

      font-family: Georgia, serif;
      font-size: 29px;
    }

    .savedEmpty p {
      margin: 8px 0 0;

      font-size: 12px;
    }

    /* ==================================================
       FOOTER + TOAST
    ================================================== */

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 24px 6px 0;

      color: rgba(255, 250, 241, 0.38);

      font-size: 10px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 100;
      bottom: max(23px, env(safe-area-inset-bottom));
      left: 50%;

      max-width: calc(100vw - 30px);
      padding: 12px 17px;

      color: var(--ink);
      border: 1px solid var(--card-border);
      border-radius: 999px;

      background: var(--card-top);

      box-shadow: 0 18px 42px rgba(5, 10, 22, 0.3);

      opacity: 0;
      pointer-events: none;

      font-size: 12px;
      font-weight: 750;
      text-align: center;

      transform:
        translateX(-50%)
        translateY(13px);

      transition:
        opacity 200ms ease,
        transform 200ms ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* ==================================================
       ANIMATION
    ================================================== */

    .questionCard.dealing {
      animation: dealCard 400ms
        cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    .questionCard.dealing .question {
      animation: revealQuestion 400ms ease;
    }

    @keyframes dealCard {
      0% {
        opacity: 0.5;

        transform:
          translateX(23px)
          translateY(-8px)
          rotate(1.3deg)
          scale(0.985);
      }

      100% {
        opacity: 1;

        transform:
          translateX(0)
          translateY(0)
          rotate(0)
          scale(1);
      }
    }

    @keyframes revealQuestion {
      0% {
        opacity: 0;
        transform: translateY(7px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 620px) {
      .page {
        width: min(100% - 22px, 720px);
      }

      .header {
        align-items: center;
        margin-bottom: 21px;
      }

      .brand {
        gap: 10px;
      }

      .brandSuit {
        width: 40px;
        height: 40px;

        border-radius: 14px;

        font-size: 23px;
      }

      .brandText h1 {
        font-size: 27px;
      }

      .subtitle {
        max-width: 250px;

        font-size: 11px;
      }

      .shareButton {
        width: 41px;
        height: 41px;

        border-radius: 14px;
      }

      .vibeControl {
        margin-bottom: 20px;
      }

      .vibeSelect {
        min-height: 50px;

        border-radius: 16px;
      }

      .deckArea {
        margin-right: 3px;
        margin-left: 3px;
      }

      .questionCard {
        min-height: 365px;
        padding: 22px 18px 20px;

        border-radius: 27px;
      }

      .deckLayer {
        border-radius: 27px;
      }

      .innerBorder {
        inset: 8px;

        border-radius: 20px;
      }

      .cardMeta {
        padding: 0 10px;
      }

      .remainingCount {
        max-width:
