<!doctype html>
<!-- Between Us — polished single-file interface, v2 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Between Us</title>
  <meta name="description" content="Between Us — a conversation deck.">
  <style>
    :root {
      --bg1:#172238; --bg2:#263653; --accent:#b76d68; --accent-dark:#92514e;
      --accent-soft:#f4dedb; --glow:rgba(183,109,104,.28);
      --card1:#fffdf8; --card2:#fff7ea; --border:#e7d4ba;
      --cream:#fffaf1; --muted:rgba(255,250,241,.68);
      --ink:#2d3340; --ink-soft:#77737a;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg1)}
    body{
      min-height:100vh;margin:0;color:var(--cream);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% 24%,var(--glow),transparent 34%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
      -webkit-font-smoothing:antialiased;
      transition:background .35s ease;
    }
    button,select{font:inherit}
    button{cursor:pointer}
    .page{width:min(calc(100% - 24px),720px);margin:auto;padding:26px 0 32px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .brand{display:flex;align-items:center;gap:12px}
    .brandSuit{
      display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;
      border:1px solid rgba(255,255,255,.16);border-radius:15px;
      background:rgba(255,255,255,.07);color:var(--accent);
      font-family:Georgia,serif;font-size:26px;
    }
    .brandSuits{
      grid-template-columns:repeat(2,1fr);
      gap:1px;
      padding:8px;
      font-size:14px;
      line-height:1;
    }
    .brandSuits span:nth-child(1){color:#c76372}
    .brandSuits span:nth-child(2){color:#3f8a5c}
    .brandSuits span:nth-child(3){color:#7756c8}
    .brandSuits span:nth-child(4){color:#a84e57}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,5vw,38px);font-weight:500;letter-spacing:-.03em}
    .subtitle{margin:6px 0 0;color:var(--muted);font-size:13px}
    .iconButton{
      display:grid;place-items:center;width:44px;height:44px;padding:0;
      color:var(--cream);border:1px solid rgba(255,255,255,.16);
      border-radius:15px;background:rgba(255,255,255,.07);font-size:20px
    }
    .control{margin-bottom:22px}
    .label{display:block;margin:0 0 7px 4px;color:rgba(255,250,241,.56);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .selectShell{position:relative}
    .selectSuit{position:absolute;z-index:2;left:17px;top:50%;transform:translateY(-52%);color:var(--accent);font-family:Georgia,serif;font-size:20px;pointer-events:none}
    .selectShell:after{content:"⌄";position:absolute;right:18px;top:50%;transform:translateY(-58%);color:var(--muted);pointer-events:none}
    select{
      width:100%;min-height:52px;padding:0 46px 0 49px;appearance:none;
      color:var(--cream);border:1px solid rgba(255,255,255,.16);border-radius:17px;
      background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.05));
      font-weight:650
    }
    select option{color:#242a36;background:white}
    .vibeButtons{
      display:flex;
      gap:9px;
      overflow-x:auto;
      padding:2px 2px 8px;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch
    }
    .vibeButtons::-webkit-scrollbar{display:none}
    .vibeButton{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex:0 0 auto;
      min-height:46px;
      padding:0 15px;
      color:rgba(255,250,241,.78);
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      background:rgba(255,255,255,.055);
      font-size:12px;
      font-weight:750;
      transition:transform .16s ease,background .2s ease,border-color .2s ease,color .2s ease
    }
    .vibeButton:hover{transform:translateY(-1px);background:rgba(255,255,255,.09)}
    .vibeButton[aria-pressed="true"]{
      color:white;
      border-color:color-mix(in srgb,var(--accent) 65%,white 5%);
      background:color-mix(in srgb,var(--accent) 34%,transparent);
      box-shadow:0 8px 20px var(--glow)
    }
    .vibeButtonSuit{font-family:Georgia,serif;font-size:17px}
    .vibeButtonSuit.allSuitsInline{font-size:12px;letter-spacing:1px}
    .deckArea{position:relative;margin:0 6px 27px;padding-bottom:13px}
    .layer{
      position:absolute;border:1px solid var(--border);border-radius:29px;
      background:linear-gradient(150deg,var(--card1),var(--card2));
      box-shadow:0 16px 32px rgba(5,10,22,.18)
    }
    .layer.one{inset:8px -6px -5px 8px;opacity:.7;transform:rotate(1.7deg)}
    .layer.two{inset:5px 7px -2px -5px;opacity:.85;transform:rotate(-1deg)}
    .card{
      position:relative;z-index:2;display:flex;min-height:380px;overflow:hidden;
      flex-direction:column;padding:25px 24px 22px;color:var(--ink);
      border:1px solid var(--border);border-radius:29px;
      background:
        radial-gradient(circle at 88% 8%,var(--accent-soft),transparent 31%),
        linear-gradient(150deg,var(--card1),var(--card2));
      box-shadow:0 30px 70px rgba(5,10,22,.3),0 10px 24px rgba(5,10,22,.2);
      transition:transform .18s ease,background .35s ease
    }
    .card:active{transform:scale(.993)}
    .watermarkPattern{
      position:absolute;
      inset:0;
      z-index:1;
      overflow:hidden;
      pointer-events:none;
      user-select:none;
    }
    .watermarkSuit{
      position:absolute;
      color:var(--accent);
      opacity:.06;
      font-family:Georgia,"Times New Roman",serif;
      line-height:1;
      transform:translate(-50%,-50%) rotate(var(--turn));
    }
    .watermarkSuit:nth-child(1){left:13%;top:18%;font-size:54px;--turn:-14deg}
    .watermarkSuit:nth-child(2){left:83%;top:16%;font-size:40px;--turn:12deg}
    .watermarkSuit:nth-child(3){left:10%;top:48%;font-size:34px;--turn:8deg}
    .watermarkSuit:nth-child(4){left:90%;top:43%;font-size:58px;--turn:-10deg}
    .watermarkSuit:nth-child(5){left:20%;top:80%;font-size:44px;--turn:15deg}
    .watermarkSuit:nth-child(6){left:78%;top:78%;font-size:36px;--turn:-16deg}
    .watermarkSuit:nth-child(7){left:38%;top:12%;font-size:28px;--turn:7deg}
    .watermarkSuit:nth-child(8){left:62%;top:88%;font-size:30px;--turn:-7deg}
    .watermarkSuit:nth-child(9){left:94%;top:68%;font-size:25px;--turn:16deg}
    .watermarkSuit:nth-child(10){left:6%;top:70%;font-size:27px;--turn:-12deg}
    .inner{position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);border-radius:22px;pointer-events:none}
    .corner{position:absolute;z-index:3;color:var(--accent);font-family:Georgia,serif;font-size:24px}
    .corner.bottom{right:20px;bottom:18px;transform:rotate(180deg)}
    .meta{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 15px}
    .pill{
      display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;
      color:var(--accent-dark);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
      border-radius:999px;background:var(--accent-soft);
      font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase
    }
    .count{color:var(--ink-soft);font-size:11px;font-weight:650;text-align:right}
    .questionWrap{position:relative;z-index:3;display:grid;flex:1;place-items:center;padding:32px 14px 24px}
    .question{
      width:min(100%,560px);margin:0;color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,40px);
      font-weight:500;line-height:1.28;letter-spacing:-.024em;text-align:center
    }
    .welcome{display:flex;align-items:center;flex-direction:column}
    .welcomeSuit{
      display:grid;place-items:center;width:64px;height:64px;margin-bottom:18px;
      color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
      border-radius:50%;background:var(--accent-soft);font-size:32px
    }
    .welcomeTitle{font-size:clamp(35px,8vw,48px)}
    .welcomeText{margin-top:10px;color:var(--ink-soft);font-family:Inter,system-ui,sans-serif;font-size:13px}
    .hint{position:relative;z-index:3;margin:0;padding:0 16px;color:var(--ink-soft);font-size:9px;font-weight:800;letter-spacing:.13em;text-align:center;text-transform:uppercase}
    .actions{display:flex;align-items:center;flex-direction:column;margin-bottom:42px}
    .deal{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:min(100%,390px);min-height:58px;padding:0 22px;color:white;
      border:1px solid rgba(255,255,255,.18);border-radius:19px;
      background:linear-gradient(135deg,var(--accent-dark),var(--accent));
      box-shadow:0 16px 31px var(--glow),inset 0 1px rgba(255,255,255,.22);
      font-weight:800
    }
    .dealSuit{font-family:Georgia,serif;font-size:21px}
    .smallActions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:12px}
    .small{
      display:flex;align-items:center;justify-content:center;gap:7px;min-height:43px;padding:0 15px;
      color:rgba(255,250,241,.86);border:1px solid rgba(255,255,255,.13);border-radius:14px;
      background:rgba(255,255,255,.06);font-size:12px;font-weight:700
    }
    .small.on{color:white;border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 32%,transparent)}
    .saved{
      padding:23px;border:1px solid rgba(255,255,255,.12);border-radius:25px;
      background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
      box-shadow:inset 0 1px rgba(255,255,255,.07),0 18px 44px rgba(5,10,22,.14)
    }
    .savedHead{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:18px}
    .eyebrow{display:block;margin-bottom:6px;color:rgba(255,250,241,.48);font-size:9px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}
    .saved h2{display:flex;align-items:center;gap:9px;margin:0;font-family:Georgia,serif;font-size:25px;font-weight:500}
    .badge{display:grid;place-items:center;min-width:26px;height:26px;padding:0 8px;color:var(--bg1);border-radius:999px;background:var(--cream);font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:850}
    .savedActions{display:flex;gap:13px}
    .textBtn{padding:3px 0;color:rgba(255,250,241,.62);border:0;background:transparent;font-size:11px;font-weight:750}
    .savedList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
    .savedCard{min-height:155px;padding:16px;color:var(--ink);border:1px solid var(--border);border-radius:19px;background:linear-gradient(145deg,var(--card1),var(--card2));box-shadow:0 12px 25px rgba(5,10,22,.14)}
    .savedTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .savedPill{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 8px;border-radius:999px;font-size:8px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
    .remove{display:grid;place-items:center;width:28px;height:28px;padding:0;color:var(--ink-soft);border:0;border-radius:50%;background:rgba(46,51,64,.06);font-size:17px}
    .savedQ{margin:0;font-family:Georgia,serif;font-size:17px;line-height:1.42}
    .empty{display:flex;align-items:center;flex-direction:column;justify-content:center;min-height:130px;color:rgba(255,250,241,.48);text-align:center}
    .emptySuit{color:var(--accent);font-family:Georgia,serif;font-size:29px}
    .empty p{margin:8px 0 0;font-size:12px}
    footer{display:flex;justify-content:center;gap:7px;padding:24px 6px 0;color:rgba(255,250,241,.38);font-size:10px;text-align:center}
    .toast{
      position:fixed;z-index:100;left:50%;bottom:24px;max-width:calc(100vw - 30px);
      padding:12px 17px;color:var(--ink);border:1px solid var(--border);border-radius:999px;
      background:var(--card1);box-shadow:0 18px 42px rgba(5,10,22,.3);
      opacity:0;transform:translate(-50%,13px);transition:.2s;font-size:12px;font-weight:750
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .card.dealing{animation:deal .4s cubic-bezier(.2,.8,.25,1)}
    @keyframes deal{from{opacity:.5;transform:translate(23px,-8px) rotate(1.3deg) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:620px){
      .page{width:min(calc(100% - 20px),720px);padding-top:20px}
      .brandSuit{width:40px;height:40px;font-size:23px}
      h1{font-size:27px}
      .subtitle{max-width:245px;font-size:11px}
      .iconButton{width:41px;height:41px}
      .card{min-height:360px;padding:22px 18px 20px;border-radius:27px}
      .layer{border-radius:27px}
      .meta{padding:0 10px}
      .count{max-width:130px;font-size:10px}
      .question{font-size:clamp(27px,8vw,35px)}
      .deal{width:100%}
      .smallActions{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
      .small{padding:0 9px}
      .saved{padding:21px 17px}
      .savedHead{align-items:flex-start;flex-direction:column}
      .savedActions{align-self:flex-end}
      .savedList{grid-template-columns:1fr}
    }
    @media(max-width:390px){
      .brandSuit{display:none}
      h1{font-size:25px}
      .question{font-size:26px}
      .small{font-size:11px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand">
        <div class="brandSuit brandSuits" aria-label="Four card suits">
          <span>♥</span><span>♦</span><span>♣</span><span>♠</span>
        </div>
        <div>
          <h1>Between Us</h1>
          <p class="subtitle">A conversation deck.</p>
        </div>
      </div>
      <button id="shareBtn" class="iconButton" type="button" aria-label="Share">↗</button>
    </header>

    <section class="control" aria-labelledby="vibeLabel">
      <span id="vibeLabel" class="label">Choose your vibe</span>
      <div id="vibeButtons" class="vibeButtons" role="group" aria-label="Choose your vibe"></div>
    </section>

    <section class="deckArea">
      <div class="layer one"></div>
      <div class="layer two"></div>
      <article id="card" class="card" tabindex="0" role="button" aria-label="Deal the next conversation card">
        <div id="watermarkPattern" class="watermarkPattern" aria-hidden="true"></div>
        <div class="inner"></div>
        <span id="cornerBottom" class="corner bottom">✦</span>
        <div class="meta">
          <span class="pill"><span id="pillSuit">✦</span><span id="pillText">All</span></span>
          <span id="count" class="count"></span>
        </div>
        <div class="questionWrap">
          <p id="question" class="question welcome">
            <span id="welcomeSuit" class="welcomeSuit">✦</span>
            <span class="welcomeTitle">Ready?</span>
            <span class="welcomeText">Tap the card to begin.</span>
          </p>
        </div>
        <p class="hint">Tap the card for the next question</p>
      </article>
    </section>

    <section class="actions">
      <button id="newBtn" class="deal" type="button"><span id="dealSuit" class="dealSuit">✦</span>Deal Next Card</button>
      <div class="smallActions">
        <button id="favBtn" class="small" type="button"><span id="favIcon">♡</span><span id="favText">Save</span></button>
        <button id="copyBtn" class="small" type="button">⧉ Copy</button>
        <button id="resetBtn" class="small" type="button">↻ Reset</button>
      </div>
    </section>

    <section class="saved">
      <div class="savedHead">
        <div>
          <span class="eyebrow">Your collection</span>
          <h2>Saved Cards <span id="savedCount" class="badge">0</span></h2>
        </div>
        <div class="savedActions">
          <button id="copyAllBtn" class="textBtn" type="button">Copy all</button>
          <button id="clearBtn" class="textBtn" type="button">Clear</button>
        </div>
      </div>
      <ul id="savedList" class="savedList"></ul>
      <div id="empty" class="empty"><span class="emptySuit">♡</span><p>Save a question you would love to revisit.</p></div>
    </section>

    <footer>Made for slow conversations and good company. <span>♡</span></footer>
  </main>

  <script src="questions.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const QUESTIONS = (window.QUESTIONS || []).map(q => ({
      id: q.id, category: String(q.category || "").trim(), question: String(q.question || "").trim()
    })).filter(q => q.category && q.question);

    const categories = [...new Set(QUESTIONS.map(q => q.category))].sort();
    const storage = {
      get(k,f){try{return JSON.parse(localStorage.getItem(k)) ?? f}catch{return f}},
      set(k,v){localStorage.setItem(k,JSON.stringify(v))},
      remove(k){localStorage.removeItem(k)}
    };
    const state = {
      category:"All", currentId:null,
      used:storage.get("conversation_used_v1",{}),
      favorites:storage.get("cs_favorites_v1",[])
    };

    const themes = [
      {keys:["core"],suit:"♣",accent:"#7756c8",dark:"#56399b",soft:"#ebe4fb",bg1:"#1b1735",bg2:"#3a2c63",glow:"rgba(119,86,200,.34)"},
      {keys:["deep","meaningful","vulnerable"],suit:"♦",accent:"#3f8a5c",dark:"#285f3c",soft:"#dff1e5",bg1:"#13271c",bg2:"#28513a",glow:"rgba(63,138,92,.32)"},
      {keys:["flirty","flirt","romance","romantic"],suit:"♥",accent:"#c76372",dark:"#9d4554",soft:"#f8dce1",bg1:"#2a1824",bg2:"#4b2336",glow:"rgba(199,99,114,.32)"},
      {keys:["fun","funny","light","lighthearted","silly"],suit:"♣",accent:"#d59b4c",dark:"#ad7430",soft:"#f8e9ce",bg1:"#252238",bg2:"#514326",glow:"rgba(213,155,76,.3)"},
      {keys:["spicy","bold","hot"],suit:"♠",accent:"#a84e57",dark:"#7e333c",soft:"#f1d9dc",bg1:"#24171d",bg2:"#51252c",glow:"rgba(168,78,87,.32)"},
      {keys:["relationship","couples","partner","love"],suit:"♡",accent:"#b9859c",dark:"#8d6175",soft:"#f2e0e8",bg1:"#211c31",bg2:"#493147",glow:"rgba(185,133,156,.3)"},
      {keys:["future","dreams","goals"],suit:"✦",accent:"#3f7f89",dark:"#285c64",soft:"#dceff1",bg1:"#132a31",bg2:"#28515a",glow:"rgba(63,127,137,.3)"}
    ];
    const fallback = {suit:"♥ ♦ ♣ ♠",accent:"#4F7ED8",dark:"#3562BE",soft:"#E4EEFF",bg1:"#162342",bg2:"#2D4774",glow:"rgba(79,126,216,.32)"};

    function themeFor(category){
      if(category==="All") return fallback;
      const name=category.toLowerCase();
      return themes.find(t=>t.keys.some(k=>name.includes(k))) || {
        ...fallback,
        suit:["♦","♣","♠","✦","●"][Math.abs(hash(name))%5]
      };
    }
    function hash(s){return [...s].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0)}
    function applyTheme(){
      const t=themeFor(state.category), r=document.documentElement;
      r.style.setProperty("--accent",t.accent);r.style.setProperty("--accent-dark",t.dark);
      r.style.setProperty("--accent-soft",t.soft);r.style.setProperty("--bg1",t.bg1);
      r.style.setProperty("--bg2",t.bg2);r.style.setProperty("--glow",t.glow);
      ["cornerBottom","pillSuit","welcomeSuit","dealSuit"].forEach(id=>{if($(id))$(id).textContent=t.suit});
      $("pillText").textContent=state.category;
      const isAll=state.category==="All";
      $("pillSuit")?.classList.toggle("pillSuitAll",isAll);

      const pattern=$("watermarkPattern");
      if(pattern){
        const suits=isAll ? ["♥","♦","♣","♠"] : [t.suit];
        pattern.innerHTML=Array.from({length:10},(_,i)=>
          `<span class="watermarkSuit">${suits[i%suits.length]}</span>`
        ).join("");
      }
    }
    function list(){return state.category==="All"?QUESTIONS:QUESTIONS.filter(q=>q.category===state.category)}
    function usedSet(){return new Set(state.used[state.category]||[])}
    function updateCount(){const l=list(),u=usedSet();$("count").textContent=`${l.filter(q=>!u.has(q.id)).length} of ${l.length} remaining`}
    function next(){
      const l=list(); if(!l.length){toast("No questions found");return}
      let a=l.filter(q=>!usedSet().has(q.id));
      if(!a.length){state.used[state.category]=[];storage.set("conversation_used_v1",state.used);a=l;toast("Deck complete — reshuffling")}
      const q=a[Math.floor(Math.random()*a.length)];
      state.currentId=q.id;(state.used[state.category] ||= []).push(q.id);storage.set("conversation_used_v1",state.used);
      $("question").className="question";$("question").textContent=q.question;updateCount();renderFavButton();animate();updateUrl();
    }
    function animate(){const c=$("card");c.classList.remove("dealing");void c.offsetWidth;c.classList.add("dealing")}
    function resetWelcome(){
      state.currentId=null;
      const t=themeFor(state.category);
      $("question").className="question welcome";
      $("question").innerHTML=`<span id="welcomeSuit" class="welcomeSuit">${t.suit}</span><span class="welcomeTitle">Ready?</span><span class="welcomeText">Tap the card to begin.</span>`;
      renderFavButton();
    }
    function renderFavButton(){
      const on=state.currentId!=null&&state.favorites.includes(state.currentId);
      $("favBtn").classList.toggle("on",on);$("favIcon").textContent=on?"♥":"♡";$("favText").textContent=on?"Saved":"Save";
    }
    function persistFavs(){state.favorites.length?storage.set("cs_favorites_v1",state.favorites):storage.remove("cs_favorites_v1")}
    function toggleFav(){
      if(state.currentId==null){toast("Deal a card first");return}
      state.favorites.includes(state.currentId)
        ? state.favorites=state.favorites.filter(id=>id!==state.currentId)
        : state.favorites.unshift(state.currentId);
      persistFavs();renderFavButton();renderSaved();toast(state.favorites.includes(state.currentId)?"Saved for later":"Removed");
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
    function renderSaved(){
      $("savedCount").textContent=state.favorites.length;$("savedList").innerHTML="";
      const items=state.favorites.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
      $("empty").style.display=items.length?"none":"flex";
      items.forEach(q=>{
        const t=themeFor(q.category),li=document.createElement("li");li.className="savedCard";
        li.innerHTML=`<div class="savedTop"><span class="savedPill" style="color:${t.dark};background:${t.soft};border:1px solid ${t.accent}55">${t.suit} ${escapeHtml(q.category)}</span><button class="remove" type="button">×</button></div><p class="savedQ">${escapeHtml(q.question)}</p>`;
        li.querySelector("button").onclick=()=>{state.favorites=state.favorites.filter(id=>id!==q.id);persistFavs();renderSaved();renderFavButton()};
        $("savedList").appendChild(li);
      });
    }
    async function copyText(text){
      try{await navigator.clipboard.writeText(text)}catch{
        const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()
      }toast("Copied");
    }
    function toast(msg){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.classList.add("show"),10);setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),250)},1400)}
    function updateUrl(){
      const u=new URL(location.href);u.searchParams.set("cat",state.category);
      state.currentId==null?u.searchParams.delete("q"):u.searchParams.set("q",state.currentId);
      history.replaceState({},"",u)
    }

    function renderVibeButtons(){
      const holder=$("vibeButtons");
      holder.innerHTML="";
      ["All",...categories].forEach(category=>{
        const t=themeFor(category);
        const button=document.createElement("button");
        button.type="button";
        button.className="vibeButton";
        button.dataset.category=category;
        button.setAttribute("aria-pressed",String(category===state.category));
        button.innerHTML=`<span class="vibeButtonSuit ${category==="All"?"allSuitsInline":""}">${t.suit}</span><span>${escapeHtml(category)}</span>`;
        button.onclick=()=>{
          state.category=category;
          applyTheme();
          resetWelcome();
          updateCount();
          updateUrl();
          renderVibeButtons();
        };
        holder.appendChild(button);
      });
      holder.querySelector('[aria-pressed="true"]')?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    }

    const params=new URL(location.href).searchParams,cat=params.get("cat"),qid=Number(params.get("q"));
    if(cat&&(cat==="All"||categories.includes(cat)))state.category=cat;
    applyTheme();
    renderVibeButtons();
    const found=QUESTIONS.find(q=>q.id===qid);
    if(found){state.currentId=found.id;$("question").className="question";$("question").textContent=found.question}else resetWelcome();
    updateCount();renderFavButton();renderSaved();

    $("newBtn").onclick=next;$("card").onclick=next;
    $("card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}};
    $("favBtn").onclick=toggleFav;
    $("copyBtn").onclick=()=>state.currentId==null?toast("Deal a card first"):copyText($("question").textContent);
    $("resetBtn").onclick=()=>{state.used[state.category]=[];storage.set("conversation_used_v1",state.used);updateCount();toast("Deck reset")};
    $("shareBtn").onclick=()=>copyText(location.href);
    $("clearBtn").onclick=()=>{state.favorites=[];persistFavs();renderSaved();renderFavButton();toast("Saved cards cleared")};
    $("copyAllBtn").onclick=()=>{
      const items=state.favorites.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
      items.length?copyText(items.map(q=>`[${q.category}] ${q.question}`).join("\n\n")):toast("Nothing saved yet")
    };

  </script>
</body>
</html>
